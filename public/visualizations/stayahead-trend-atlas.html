  background-color: var(--card);
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;]:checked {
  border-color: var(--primary);
  background-color: var(--primary);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:checked::before {
  display: block;
  width: 100%;
  height: 100%;
  background: var(--primary-foreground);
  content: &quot;&quot;;
  mask: var(--checkmark-image) center / 12px 12px no-repeat;
}

.form-check-input[type=&quot;radio&quot;] {
  width: 14px;
  height: 14px;
  border-radius: var(--radius-full);
}

.form-check-input[type=&quot;radio&quot;]:checked {
  border: 2px solid var(--primary);
  background:
    radial-gradient(circle, var(--primary-foreground) 0 2.5px, transparent 3px),
    var(--primary);
}

.form-check:not(.form-switch) .form-check-input:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

.form-check:not(.form-switch) .form-check-input:disabled {
  cursor: not-allowed;
  pointer-events: none;
}

.form-check:not(.form-switch) .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
}

.form-switch .form-check-input:disabled,
.form-switch .form-check-input:disabled + .form-check-label {
  cursor: not-allowed;
  opacity: 0.6;
}

.form-check-label {
  color: var(--foreground);
  cursor: var(--cursor-interaction, default);
}

.form-switch .form-check-input {
  position: relative;
  width: 32px;
  height: 20px;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
  box-shadow: none;
  transition: background-color 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input::before {
  position: absolute;
  top: 50%;
  left: 0;
  width: 16px;
  height: 16px;
  box-sizing: border-box;
  border: 1px solid light-dark(var(--primary-foreground), var(--foreground));
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
  box-shadow: var(--shadow-sm);
  content: &quot;&quot;;
  transform: translate(2px, -50%);
  transition: transform 200ms cubic-bezier(0, 0, 0.2, 1);
}

.form-switch .form-check-input:checked {
  background: var(--primary);
}

.form-switch .form-check-input:checked::before {
  transform: translate(14px, -50%);
}

.form-switch .form-check-input:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}

.form-range {
  appearance: none;
  display: block;
  width: 100%;
  height: 28px;
  flex: 1;
  margin: 0;
  padding: 0;
  outline: none;
  border: 0;
  accent-color: var(--primary);
  background: linear-gradient(
      color-mix(in srgb, var(--foreground) 7%, transparent),
      color-mix(in srgb, var(--foreground) 7%, transparent)
    )
    center / 100% 2px no-repeat;
}

.form-range::-webkit-slider-runnable-track {
  height: 28px;
  background: transparent;
}

.form-range::-webkit-slider-thumb {
  appearance: none;
  width: 20px;
  height: 20px;
  margin-top: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-webkit-slider-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range::-moz-range-track {
  height: 28px;
  background: transparent;
}

.form-range::-moz-range-thumb {
  width: 20px;
  height: 20px;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  background: light-dark(var(--primary-foreground), var(--foreground));
}

.form-range:focus-visible::-moz-range-thumb {
  border-color: var(--ring);
  box-shadow: inset 0 0 0 1px var(--ring);
}

.form-range:disabled {
  cursor: not-allowed;
  opacity: 0.4;
}

.btn:not(.btn-primary, .viz-tile):is(
  [aria-pressed=&quot;true&quot;],
  [aria-selected=&quot;true&quot;],
  .is-selected
) {
  border-color: var(--primary);
  color: var(--primary-foreground);
  background: var(--primary);
}

.btn.viz-tile:is([aria-pressed=&quot;true&quot;], [aria-selected=&quot;true&quot;], .is-selected) {
  border-color: var(--primary);
  box-shadow: inset 0 0 0 1px var(--primary);
}

.btn:focus-visible {
  outline: 2px solid var(--ring);
  outline-offset: 2px;
}

svg {
  display: block;
  max-width: 100%;
  height: auto;
}

#widget &gt; svg {
  width: 100%;
}

/* Model-authored chart rules can otherwise stretch icons after these styles load. */
svg.lucide {
  display: block;
  width: 16px !important;
  height: 16px !important;
  flex: none;
  margin: 0 !important;
  stroke-width: 1.6;
}

.text-warning,
.text-destructive {
  color: var(--destructive);
}

html&gt;body{padding:0}&lt;/style&gt;
&lt;/head&gt;
&lt;body&gt;
&lt;div id=&quot;stayahead-trend-atlas&quot;&gt;
  &lt;style&gt;
    #stayahead-trend-atlas {
      position: relative;
      width: 100%;
      color: var(--foreground);
      font-size: var(--font-size-base);
    }
    #stayahead-trend-atlas * { box-sizing: border-box; }
    #stayahead-trend-atlas .sah-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    #stayahead-trend-atlas h2,
    #stayahead-trend-atlas h3 { margin: 0; font-weight: 500; }
    #stayahead-trend-atlas h3 { margin-bottom: 6px; }
    #stayahead-trend-atlas .sah-subtitle,
    #stayahead-trend-atlas .sah-selection { color: var(--muted-foreground); }
    #stayahead-trend-atlas .sah-controls { min-width: min(100%, 360px); }
    #stayahead-trend-atlas .sah-controls label { display: block; margin-bottom: 4px; }
    #stayahead-trend-atlas .sah-legend {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0 14px;
    }
    #stayahead-trend-atlas .sah-legend button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 0;
      border: 0;
      background: transparent;
      color: var(--foreground);
      cursor: pointer;
    }
    #stayahead-trend-atlas .sah-legend button[aria-pressed=&quot;false&quot;] { opacity: 0.35; }
    #stayahead-trend-atlas .sah-swatch { width: 10px; height: 10px; display: inline-block; }
    #stayahead-trend-atlas .sah-r1 { background: var(--viz-series-1); }
    #stayahead-trend-atlas .sah-r2 { background: var(--viz-series-2); }
    #stayahead-trend-atlas .sah-r3 { background: var(--viz-series-3); }
    #stayahead-trend-atlas .sah-r4 { background: var(--viz-series-4); }
    #stayahead-trend-atlas .sah-r5 { background: var(--viz-series-5); }
    #stayahead-trend-atlas .sah-block { margin-top: 18px; }
    #stayahead-trend-atlas .sah-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      align-items: start;
    }
    #stayahead-trend-atlas .sah-chart { width: 100%; min-width: 0; }
    #stayahead-trend-atlas svg { display: block; width: 100%; overflow: visible; }
    #stayahead-trend-atlas svg text { fill: var(--foreground); font-size: 12px; }
    #stayahead-trend-atlas svg .sah-muted { fill: var(--muted-foreground); }
    #stayahead-trend-atlas svg .domain,
    #stayahead-trend-atlas svg .tick line { stroke: var(--border); }
    #stayahead-trend-atlas svg .sah-gridline line { stroke: var(--border); opacity: 0.55; }
    #stayahead-trend-atlas svg .sah-gridline .domain { display: none; }
    #stayahead-trend-atlas svg .axis-title { fill: var(--foreground); font-size: 12px; }
    #stayahead-trend-atlas .sah-tooltip {
      position: absolute;
      z-index: 4;
      max-width: 300px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      background: var(--popover);
      color: var(--popover-foreground);
      white-space: pre-line;
      pointer-events: none;
    }
    @media (max-width: 700px) {
      #stayahead-trend-atlas .sah-grid { grid-template-columns: 1fr; }
      #stayahead-trend-atlas .sah-controls { width: 100%; }
    }
  &lt;/style&gt;

  &lt;div class=&quot;sah-head&quot;&gt;
    &lt;div&gt;
      &lt;h2&gt;How papers stay in view&lt;/h2&gt;
      &lt;div class=&quot;sah-subtitle&quot;&gt;Illustrative data · 263 days · 1,315 ranked appearances&lt;/div&gt;
    &lt;/div&gt;
    &lt;div class=&quot;sah-controls&quot;&gt;
      &lt;label class=&quot;form-label&quot; for=&quot;sah-paper-select&quot;&gt;Inspect paper&lt;/label&gt;
      &lt;select id=&quot;sah-paper-select&quot; class=&quot;form-select&quot;&gt;&lt;/select&gt;
    &lt;/div&gt;
  &lt;/div&gt;

  &lt;div id=&quot;sah-selection&quot; class=&quot;sah-selection&quot;&gt;&lt;/div&gt;
  &lt;div class=&quot;sah-legend&quot; aria-label=&quot;Rank filters&quot;&gt;
    &lt;span class=&quot;text-muted&quot;&gt;Rank&lt;/span&gt;
    &lt;button type=&quot;button&quot; data-rank=&quot;1&quot; aria-pressed=&quot;true&quot;&gt;&lt;span class=&quot;sah-swatch sah-r1&quot;&gt;&lt;/span&gt;1&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-rank=&quot;2&quot; aria-pressed=&quot;true&quot;&gt;&lt;span class=&quot;sah-swatch sah-r2&quot;&gt;&lt;/span&gt;2&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-rank=&quot;3&quot; aria-pressed=&quot;true&quot;&gt;&lt;span class=&quot;sah-swatch sah-r3&quot;&gt;&lt;/span&gt;3&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-rank=&quot;4&quot; aria-pressed=&quot;true&quot;&gt;&lt;span class=&quot;sah-swatch sah-r4&quot;&gt;&lt;/span&gt;4&lt;/button&gt;
    &lt;button type=&quot;button&quot; data-rank=&quot;5&quot; aria-pressed=&quot;true&quot;&gt;&lt;span class=&quot;sah-swatch sah-r5&quot;&gt;&lt;/span&gt;5&lt;/button&gt;
  &lt;/div&gt;

  &lt;section class=&quot;sah-block&quot;&gt;
    &lt;h3&gt;Persistence map&lt;/h3&gt;
    &lt;div id=&quot;sah-timeline&quot; class=&quot;sah-chart&quot;&gt;&lt;/div&gt;
  &lt;/section&gt;

  &lt;div class=&quot;sah-grid sah-block&quot;&gt;
    &lt;section&gt;
      &lt;h3&gt;Persistence constellation&lt;/h3&gt;
      &lt;div id=&quot;sah-scatter&quot; class=&quot;sah-chart&quot;&gt;&lt;/div&gt;
    &lt;/section&gt;
    &lt;section&gt;
      &lt;h3&gt;Selected paper score path&lt;/h3&gt;
      &lt;div id=&quot;sah-line&quot; class=&quot;sah-chart&quot;&gt;&lt;/div&gt;
    &lt;/section&gt;
  &lt;/div&gt;

  &lt;div id=&quot;sah-tooltip&quot; class=&quot;sah-tooltip&quot; role=&quot;tooltip&quot; hidden&gt;&lt;/div&gt;

  &lt;script src=&quot;https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js&quot;&gt;&lt;/script&gt;
  &lt;script&gt;
    (() =&gt; {
      const root = document.getElementById(&#x27;stayahead-trend-atlas&#x27;);
      const payload = (() =&gt; {
        const rows = [];
        const titles = {};
        const start = Date.UTC(2025, 0, 1);
        for (let paper = 0; paper &lt; 63; paper += 1) {
          const id = &#x27;paper-&#x27; + String(paper + 1).padStart(2, &#x27;0&#x27;);
          titles[id] = {
            title: &#x27;Illustrative paper &#x27; + String(paper + 1).padStart(2, &#x27;0&#x27;),
            journal: &#x27;Synthetic demo&#x27;
          };
        }
        for (let day = 0; day &lt; 263; day += 1) {
          const dayText = new Date(start + day * 86400000).toISOString().slice(0, 10);
          for (let rank = 1; rank &lt;= 5; rank += 1) {
            const paper = (Math.floor(day / 10) + (rank - 1) * 13) % 63;
            const id = &#x27;paper-&#x27; + String(paper + 1).padStart(2, &#x27;0&#x27;);
            const score = 420 + (5 - rank) * 160 + ((paper * 37 + day * 11) % 240);
            rows.push([dayText, id, rank, score]);
          }
        }
        return { rows, titles };
      })();
      const parseDay = d3.timeParse(&#x27;%Y-%m-%d&#x27;);
      const formatDay = d3.timeFormat(&#x27;%d %b %Y&#x27;);
      const formatScore = d3.format(&#x27;,&#x27;);
      const rankColor = rank =&gt; `var(--viz-series-${rank})`;
      const rows = payload.rows.map(d =&gt; ({ day: parseDay(d[0]), dayText: d[0], doi: d[1], rank: d[2], score: d[3] }));
      const visibleRanks = new Set([1, 2, 3, 4, 5]);
      const titleFor = doi =&gt; payload.titles[doi]?.title || doi;
      const journalFor = doi =&gt; payload.titles[doi]?.journal || &#x27;Journal not enriched&#x27;;
      const byPaper = d3.group(rows, d =&gt; d.doi);
      const papers = Array.from(byPaper, ([doi, values]) =&gt; {
        values.sort((a, b) =&gt; d3.ascending(a.day, b.day));
        return {
          doi,
          values,
          title: titleFor(doi),
          journal: journalFor(doi),
          appearances: values.length,
          first: d3.min(values, d =&gt; d.day),
          last: d3.max(values, d =&gt; d.day),
          peak: d3.max(values, d =&gt; d.score),
          meanRank: d3.mean(values, d =&gt; d.rank),
          rankOneDays: d3.sum(values, d =&gt; d.rank === 1 ? 1 : 0)
        };
      }).sort((a, b) =&gt; d3.descending(a.appearances, b.appearances) || d3.descending(a.peak, b.peak));
      const paperByDoi = new Map(papers.map(d =&gt; [d.doi, d]));
      let selectedDoi = papers[0].doi;
      const select = root.querySelector(&#x27;#sah-paper-select&#x27;);
      const selection = root.querySelector(&#x27;#sah-selection&#x27;);
      const tooltip = root.querySelector(&#x27;#sah-tooltip&#x27;);

      papers.forEach(p =&gt; {
        const option = document.createElement(&#x27;option&#x27;);
        option.value = p.doi;
        option.textContent = p.title === p.doi ? p.doi : `${p.title} (${p.doi})`;
        select.appendChild(option);
      });
      select.value = selectedDoi;

      function showTooltip(event, lines) {
        tooltip.textContent = lines.join(&#x27;\n&#x27;);
        tooltip.hidden = false;
        const rootBox = root.getBoundingClientRect();
        const tipBox = tooltip.getBoundingClientRect();
        let left = event.clientX - rootBox.left + 12;
        let top = event.clientY - rootBox.top + 12;
        left = Math.min(left, rootBox.width - tipBox.width - 6);
        top = Math.max(6, Math.min(top, rootBox.height - tipBox.height - 6));
        tooltip.style.left = `${Math.max(6, left)}px`;
        tooltip.style.top = `${top}px`;
      }
      function hideTooltip() { tooltip.hidden = true; }

      function updateSelection(doi) {
        selectedDoi = doi;
        select.value = doi;
        const p = paperByDoi.get(doi);
        selection.textContent = `${p.title} · ${p.appearances} appearances · ${p.rankOneDays} days at rank 1 · score ${formatScore(d3.min(p.values, d =&gt; d.score))}–${formatScore(p.peak)}`;
        drawAll();
      }

      function addFrame(svg, x, y, width, height) {
        svg.append(&#x27;rect&#x27;)
          .attr(&#x27;data-chart-frame&#x27;, &#x27;&#x27;)
          .attr(&#x27;x&#x27;, x).attr(&#x27;y&#x27;, y).attr(&#x27;width&#x27;, width).attr(&#x27;height&#x27;, height)
          .attr(&#x27;fill&#x27;, &#x27;none&#x27;).attr(&#x27;stroke&#x27;, &#x27;var(--border)&#x27;);
      }

      function drawTimeline() {
        const container = root.querySelector(&#x27;#sah-timeline&#x27;);
        container.replaceChildren();
        const width = Math.max(320, container.getBoundingClientRect().width);
        const height = width &lt; 500 ? 430 : 470;
        const margin = { top: 10, right: 16, bottom: 46, left: 66 };
        const innerW = width - margin.left - margin.right;
        const innerH = height - margin.top - margin.bottom;
        const ordered = [...papers].sort((a, b) =&gt; d3.ascending(a.first, b.first) || d3.descending(a.appearances, b.appearances));
        const x = d3.scaleTime().domain(d3.extent(rows, d =&gt; d.day)).range([margin.left + 3, margin.left + innerW - 3]);
        const y = d3.scaleBand().domain(ordered.map(d =&gt; d.doi)).range([margin.top + 3, margin.top + innerH - 3]).padding(0.16);
        const svg = d3.select(container).append(&#x27;svg&#x27;).attr(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`).attr(&#x27;role&#x27;, &#x27;img&#x27;).attr(&#x27;aria-label&#x27;, &#x27;Timeline of every ranked paper appearance across 263 days&#x27;);
        svg.append(&#x27;title&#x27;).text(&#x27;Persistence map of paper appearances&#x27;);
        svg.append(&#x27;desc&#x27;).text(&#x27;Each horizontal lane is a DOI. Marks show daily appearances and color shows rank from one to five.&#x27;);
        addFrame(svg, margin.left, margin.top, innerW, innerH);
        const xAxis = d3.axisBottom(x).ticks(width &lt; 500 ? 4 : 7).tickSizeOuter(0);
        svg.append(&#x27;g&#x27;).attr(&#x27;transform&#x27;, `translate(0,${margin.top + innerH})`).call(xAxis);
        svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;axis-title&#x27;).attr(&#x27;data-axis&#x27;, &#x27;x&#x27;).attr(&#x27;x&#x27;, margin.left + innerW / 2).attr(&#x27;y&#x27;, height - 5).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(&#x27;Date&#x27;);
        svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;axis-title&#x27;).attr(&#x27;data-axis&#x27;, &#x27;y&#x27;).attr(&#x27;transform&#x27;, `translate(15,${margin.top + innerH / 2}) rotate(-90)`).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(&#x27;Papers ordered by first appearance&#x27;);
        const marks = rows.filter(d =&gt; visibleRanks.has(d.rank));
        svg.append(&#x27;g&#x27;).selectAll(&#x27;rect&#x27;).data(marks).join(&#x27;rect&#x27;)
          .attr(&#x27;x&#x27;, d =&gt; x(d.day) - 1.4)
          .attr(&#x27;y&#x27;, d =&gt; y(d.doi) + Math.max(0, y.bandwidth() * 0.1))
          .attr(&#x27;width&#x27;, 2.8)
          .attr(&#x27;height&#x27;, Math.max(2, y.bandwidth() * 0.8))
          .attr(&#x27;fill&#x27;, d =&gt; rankColor(d.rank))
          .attr(&#x27;opacity&#x27;, d =&gt; d.doi === selectedDoi ? 1 : 0.66)
          .on(&#x27;pointerenter pointermove&#x27;, (event, d) =&gt; showTooltip(event, [titleFor(d.doi), d.doi, `${formatDay(d.day)} · rank ${d.rank} · score ${formatScore(d.score)}`]))
          .on(&#x27;pointerleave&#x27;, hideTooltip)
          .on(&#x27;click&#x27;, (_, d) =&gt; updateSelection(d.doi));
        const selected = paperByDoi.get(selectedDoi);
        svg.append(&#x27;rect&#x27;)
          .attr(&#x27;x&#x27;, margin.left + 1).attr(&#x27;y&#x27;, y(selectedDoi) - 1)
          .attr(&#x27;width&#x27;, innerW - 2).attr(&#x27;height&#x27;, y.bandwidth() + 2)
          .attr(&#x27;fill&#x27;, &#x27;none&#x27;).attr(&#x27;stroke&#x27;, &#x27;var(--foreground)&#x27;).attr(&#x27;stroke-width&#x27;, 1.5)
          .attr(&#x27;pointer-events&#x27;, &#x27;none&#x27;);
        svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;sah-muted&#x27;).attr(&#x27;x&#x27;, margin.left + 5).attr(&#x27;y&#x27;, y(selectedDoi) - 4).text(selected.title.length &gt; 50 ? `${selected.title.slice(0, 47)}…` : selected.title);
      }

      function drawScatter() {
        const container = root.querySelector(&#x27;#sah-scatter&#x27;);
        container.replaceChildren();
        const width = Math.max(320, container.getBoundingClientRect().width);
        const height = width &lt; 500 ? 390 : 420;
        const margin = { top: 14, right: 18, bottom: 54, left: 68 };
        const innerW = width - margin.left - margin.right;
        const innerH = height - margin.top - margin.bottom;
        const xExtent = d3.extent(papers, d =&gt; d.appearances);
        const yExtent = d3.extent(papers, d =&gt; d.peak);
        const x = d3.scaleLinear().domain([Math.max(0, xExtent[0] - 2), xExtent[1] + 3]).nice().range([margin.left + 4, margin.left + innerW - 4]);
        const y = d3.scaleLinear().domain([Math.max(0, yExtent[0] - 100), yExtent[1] + 180]).nice().range([margin.top + innerH - 4, margin.top + 4]);
        const r = d3.scaleSqrt().domain(d3.extent(papers, d =&gt; d.rankOneDays)).range([4, 12]);
        const svg = d3.select(container).append(&#x27;svg&#x27;).attr(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`).attr(&#x27;role&#x27;, &#x27;img&#x27;).attr(&#x27;aria-label&#x27;, &#x27;Scatter plot comparing paper persistence and peak score&#x27;);
        svg.append(&#x27;title&#x27;).text(&#x27;Persistence constellation&#x27;);
        svg.append(&#x27;desc&#x27;).text(&#x27;Papers are positioned by number of appearances and peak score. Circle size represents days at rank one.&#x27;);
        addFrame(svg, margin.left, margin.top, innerW, innerH);
        svg.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;sah-gridline&#x27;).attr(&#x27;transform&#x27;, `translate(0,${margin.top + innerH})`).call(d3.axisBottom(x).ticks(width &lt; 500 ? 4 : 6).tickSize(-innerH).tickFormat(&#x27;&#x27;));
        svg.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;sah-gridline&#x27;).attr(&#x27;transform&#x27;, `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-innerW).tickFormat(&#x27;&#x27;));
        svg.append(&#x27;g&#x27;).attr(&#x27;transform&#x27;, `translate(0,${margin.top + innerH})`).call(d3.axisBottom(x).ticks(width &lt; 500 ? 4 : 6).tickSizeOuter(0));
        svg.append(&#x27;g&#x27;).attr(&#x27;transform&#x27;, `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5).tickFormat(d3.format(&#x27;~s&#x27;)).tickSizeOuter(0));
        svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;axis-title&#x27;).attr(&#x27;data-axis&#x27;, &#x27;x&#x27;).attr(&#x27;x&#x27;, margin.left + innerW / 2).attr(&#x27;y&#x27;, height - 7).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(&#x27;Appearances (days)&#x27;);
        svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;axis-title&#x27;).attr(&#x27;data-axis&#x27;, &#x27;y&#x27;).attr(&#x27;transform&#x27;, `translate(15,${margin.top + innerH / 2}) rotate(-90)`).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(&#x27;Peak score&#x27;);
        const points = svg.append(&#x27;g&#x27;).selectAll(&#x27;circle&#x27;).data(papers.filter(p =&gt; p.values.some(v =&gt; visibleRanks.has(v.rank)))).join(&#x27;circle&#x27;)
          .attr(&#x27;cx&#x27;, d =&gt; x(d.appearances)).attr(&#x27;cy&#x27;, d =&gt; y(d.peak)).attr(&#x27;r&#x27;, d =&gt; r(d.rankOneDays))
          .attr(&#x27;fill&#x27;, d =&gt; rankColor(Math.max(1, Math.min(5, Math.round(d.meanRank)))))
          .attr(&#x27;opacity&#x27;, d =&gt; d.doi === selectedDoi ? 1 : 0.58)
          .attr(&#x27;stroke&#x27;, d =&gt; d.doi === selectedDoi ? &#x27;var(--foreground)&#x27; : &#x27;none&#x27;)

          .style(&#x27;cursor&#x27;, &#x27;pointer&#x27;)
          .on(&#x27;pointerenter pointermove&#x27;, (event, d) =&gt; showTooltip(event, [d.title, d.doi, `${d.appearances} appearances · peak ${formatScore(d.peak)} · mean rank ${d.meanRank.toFixed(1)}`, `${d.rankOneDays} days at rank 1`]))
          .on(&#x27;pointerleave&#x27;, hideTooltip)
          .on(&#x27;click&#x27;, (_, d) =&gt; updateSelection(d.doi));
        points.filter(d =&gt; d.doi === selectedDoi).raise();
      }

      function drawLine() {
        const container = root.querySelector(&#x27;#sah-line&#x27;);
        container.replaceChildren();
        const width = Math.max(320, container.getBoundingClientRect().width);
        const height = width &lt; 500 ? 390 : 420;
        const margin = { top: 14, right: 18, bottom: 54, left: 68 };
        const innerW = width - margin.left - margin.right;
        const innerH = height - margin.top - margin.bottom;
        const paper = paperByDoi.get(selectedDoi);
        const values = paper.values.filter(d =&gt; visibleRanks.has(d.rank));
        const allValues = paper.values;
        const xExtent = d3.extent(allValues, d =&gt; d.day);
        const xPad = Math.max(86400000, (xExtent[1] - xExtent[0]) * 0.03);
        const yExtent = d3.extent(allValues, d =&gt; d.score);
        const yPad = Math.max(10, (yExtent[1] - yExtent[0]) * 0.1);
        const x = d3.scaleTime().domain([new Date(+xExtent[0] - xPad), new Date(+xExtent[1] + xPad)]).range([margin.left + 4, margin.left + innerW - 4]);
        const y = d3.scaleLinear().domain([Math.max(0, yExtent[0] - yPad), yExtent[1] + yPad]).nice().range([margin.top + innerH - 4, margin.top + 4]);
        const svg = d3.select(container).append(&#x27;svg&#x27;).attr(&#x27;viewBox&#x27;, `0 0 ${width} ${height}`).attr(&#x27;role&#x27;, &#x27;img&#x27;).attr(&#x27;aria-label&#x27;, `Score trajectory for ${paper.title}`);
        svg.append(&#x27;title&#x27;).text(`Score trajectory for ${paper.title}`);
        svg.append(&#x27;desc&#x27;).text(&#x27;The line follows score over time. Point color identifies daily rank from one to five.&#x27;);
        addFrame(svg, margin.left, margin.top, innerW, innerH);
        svg.append(&#x27;g&#x27;).attr(&#x27;class&#x27;, &#x27;sah-gridline&#x27;).attr(&#x27;transform&#x27;, `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-innerW).tickFormat(&#x27;&#x27;));
        svg.append(&#x27;g&#x27;).attr(&#x27;transform&#x27;, `translate(0,${margin.top + innerH})`).call(d3.axisBottom(x).ticks(width &lt; 500 ? 4 : 6).tickSizeOuter(0));
        svg.append(&#x27;g&#x27;).attr(&#x27;transform&#x27;, `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5).tickFormat(d3.format(&#x27;~s&#x27;)).tickSizeOuter(0));
        svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;axis-title&#x27;).attr(&#x27;data-axis&#x27;, &#x27;x&#x27;).attr(&#x27;x&#x27;, margin.left + innerW / 2).attr(&#x27;y&#x27;, height - 7).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(&#x27;Appearance date&#x27;);
        svg.append(&#x27;text&#x27;).attr(&#x27;class&#x27;, &#x27;axis-title&#x27;).attr(&#x27;data-axis&#x27;, &#x27;y&#x27;).attr(&#x27;transform&#x27;, `translate(15,${margin.top + innerH / 2}) rotate(-90)`).attr(&#x27;text-anchor&#x27;, &#x27;middle&#x27;).text(&#x27;Illustrative score&#x27;);
        if (values.length &gt; 1) {
          svg.append(&#x27;path&#x27;).datum(values).attr(&#x27;fill&#x27;, &#x27;none&#x27;).attr(&#x27;stroke&#x27;, &#x27;var(--foreground)&#x27;).attr(&#x27;stroke-width&#x27;, 1.5).attr(&#x27;d&#x27;, d3.line().x(d =&gt; x(d.day)).y(d =&gt; y(d.score)));
        }
        svg.append(&#x27;g&#x27;).selectAll(&#x27;circle&#x27;).data(values).join(&#x27;circle&#x27;)
          .attr(&#x27;cx&#x27;, d =&gt; x(d.day)).attr(&#x27;cy&#x27;, d =&gt; y(d.score)).attr(&#x27;r&#x27;, 4)
          .attr(&#x27;fill&#x27;, d =&gt; rankColor(d.rank)).attr(&#x27;stroke&#x27;, &#x27;var(--background)&#x27;).attr(&#x27;stroke-width&#x27;, 1)
          .on(&#x27;pointerenter pointermove&#x27;, (event, d) =&gt; showTooltip(event, [paper.title, `${formatDay(d.day)} · rank ${d.rank} · score ${formatScore(d.score)}`]))
          .on(&#x27;pointerleave&#x27;, hideTooltip);
      }

      function drawAll() {
        drawTimeline();
        drawScatter();
        drawLine();
      }

      select.addEventListener(&#x27;change&#x27;, event =&gt; updateSelection(event.target.value));
      root.querySelectorAll(&#x27;.sah-legend button&#x27;).forEach(button =&gt; {
        button.addEventListener(&#x27;click&#x27;, () =&gt; {
          const rank = Number(button.dataset.rank);
          if (visibleRanks.has(rank) &amp;&amp; visibleRanks.size &gt; 1) visibleRanks.delete(rank);
          else visibleRanks.add(rank);
          button.setAttribute(&#x27;aria-pressed&#x27;, String(visibleRanks.has(rank)));
          drawAll();

      const observer = new ResizeObserver(() =&gt; drawAll());
      observer.observe(root);
      updateSelection(selectedDoi);
    })();
  &lt;/script&gt;
&lt;/div&gt;

&lt;script src=&quot;https://unpkg.com/@floating-ui/core@1.7.3/dist/floating-ui.core.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script src=&quot;https://unpkg.com/@floating-ui/dom@1.7.4/dist/floating-ui.dom.umd.min.js&quot;&gt;&lt;/script&gt;
&lt;script&gt;
(() =&gt; {
  if (window.FloatingUIDOM == null) {
    return;
  }
  const { autoUpdate, computePosition, flip, offset, shift, size } =
    window.FloatingUIDOM;
  const tooltipPlacements = new Set([&quot;top&quot;, &quot;right&quot;, &quot;bottom&quot;, &quot;left&quot;]);
  const tooltipId = `codex-visualization-tooltip-${
    window.crypto?.randomUUID?.() ?? Date.now().toString(36)
  }`;
  const tooltipGap = 5;
  const hoverDelay = 700;
  const skipDelay = 300;
  let activeTrigger = null;
  let pendingTrigger = null;
  let tooltip = null;
  let openTimeout = null;
  let autoUpdateCleanup = null;
  let positionRequest = 0;
  let skipDelayUntil = 0;

  const getTrigger = (target) =&gt;
    target?.nodeType === Node.ELEMENT_NODE
      ? target.closest(&quot;[data-tooltip]&quot;)
      : null;
  const containsTarget = (trigger, target) =&gt;
    target?.nodeType != null &amp;&amp; trigger.contains(target);
  const getContent = (trigger) =&gt;
    trigger.getAttribute(&quot;data-tooltip&quot;)?.trim() ?? &quot;&quot;;
  const getPlacement = (trigger) =&gt; {
    const placement = trigger.getAttribute(&quot;data-tooltip-placement&quot;);
    return tooltipPlacements.has(placement) ? placement : &quot;top&quot;;
  };
  const getTooltip = () =&gt; {
    if (tooltip == null) {
      tooltip = document.createElement(&quot;div&quot;);
      tooltip.id = tooltipId;
      tooltip.className = &quot;tooltip&quot;;
      tooltip.setAttribute(&quot;role&quot;, &quot;tooltip&quot;);
    }
    return tooltip;
  };
  const setDescribedBy = (trigger, described) =&gt; {
    const ids = new Set(
      (trigger.getAttribute(&quot;aria-describedby&quot;) ?? &quot;&quot;)
        .split(/\s+/)
        .filter(Boolean),
    );
    if (described) {
      ids.add(tooltipId);
    } else {
      ids.delete(tooltipId);
    }
    if (ids.size === 0) {
      trigger.removeAttribute(&quot;aria-describedby&quot;);
    } else {
      trigger.setAttribute(&quot;aria-describedby&quot;, [...ids].join(&quot; &quot;));
    }
  };
  const clearOpenTimeout = () =&gt; {
    if (openTimeout != null) {
      window.clearTimeout(openTimeout);
      openTimeout = null;
    }
    pendingTrigger = null;
  };
  const closeTooltip = (activateSkipDelay = true) =&gt; {
    clearOpenTimeout();
    positionRequest += 1;
    autoUpdateCleanup?.();
    autoUpdateCleanup = null;
    if (activeTrigger == null) {
      return;
    }
    setDescribedBy(activeTrigger, false);
    activeTrigger = null;
    tooltip?.remove();
    if (activateSkipDelay) {
      skipDelayUntil = Date.now() + skipDelay;
    }
  };
  const updatePosition = (trigger, floating) =&gt; {
    const request = ++positionRequest;
    void computePosition(trigger, floating, {
      middleware: [
        offset(tooltipGap),
        flip({ padding: tooltipGap }),
        shift({ padding: tooltipGap }),
        size({
          padding: tooltipGap,
          apply({ availableHeight, availableWidth, elements }) {
            elements.floating.style.setProperty(
              &quot;--tooltip-available-width&quot;,
              `${Math.max(0, availableWidth)}px`,
            );
            elements.floating.style.setProperty(
              &quot;--tooltip-available-height&quot;,
              `${Math.max(0, availableHeight)}px`,
            );
          },
        }),
      ],
      placement: getPlacement(trigger),
      strategy: &quot;fixed&quot;,
    })
      .then(({ x, y }) =&gt; {
        if (activeTrigger !== trigger || request !== positionRequest) {
          return;
        }
        const scale = window.devicePixelRatio || 1;
        floating.style.transform = `translate(${Math.round(x * scale) / scale}px, ${Math.round(y * scale) / scale}px)`;
        floating.style.visibility = &quot;visible&quot;;
      })
      .catch(() =&gt; {
        if (activeTrigger === trigger &amp;&amp; request === positionRequest) {
          closeTooltip(false);
        }
      });
  };
  const openTooltip = (trigger) =&gt; {
    const content = getContent(trigger);
    if (!trigger.isConnected || content.length === 0) {
      return;
    }
    clearOpenTimeout();
    if (activeTrigger === trigger) {
      return;
    }
    closeTooltip();
    const floating = getTooltip();
    floating.textContent = content;
    floating.style.visibility = &quot;hidden&quot;;
    floating.style.transform = &quot;translate(0, 0)&quot;;
    document.body.appendChild(floating);
    activeTrigger = trigger;
    setDescribedBy(trigger, true);
    autoUpdateCleanup = autoUpdate(trigger, floating, () =&gt; {
      updatePosition(trigger, floating);
    });
  };
  const requestOpen = (trigger, immediate = false) =&gt; {
    if (
      getContent(trigger).length === 0 ||
      activeTrigger === trigger ||
      pendingTrigger === trigger
    ) {
      return;
    }
    clearOpenTimeout();
    pendingTrigger = trigger;
    const delay =
      immediate || activeTrigger != null || Date.now() &lt; skipDelayUntil
        ? 0
        : hoverDelay;
    if (delay === 0) {
      openTooltip(trigger);
      return;
    }
    openTimeout = window.setTimeout(() =&gt; {
      openTimeout = null;
      pendingTrigger = null;
      openTooltip(trigger);
    }, delay);
  };
  const handlePointerOpen = (event) =&gt; {
    if (event.pointerType === &quot;touch&quot;) {
      return;
    }
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    requestOpen(trigger);
  };
  const handleLeave = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger == null || containsTarget(trigger, event.relatedTarget)) {
      return;
    }
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const handleFocusIn = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (trigger?.matches(&quot;:focus-visible&quot;)) {
      requestOpen(trigger, true);
    }
  };
  const handleKeyDown = (event) =&gt; {
    if (event.key === &quot;Escape&quot;) {
      closeTooltip();
    }
  };
  const handleContextMenu = (event) =&gt; {
    const trigger = getTrigger(event.target);
    if (activeTrigger === trigger || pendingTrigger === trigger) {
      closeTooltip();
    }
  };
  const destroy = () =&gt; {
    closeTooltip(false);
    document.removeEventListener(&quot;pointerover&quot;, handlePointerOpen);
    document.removeEventListener(&quot;pointerout&quot;, handleLeave);
    document.removeEventListener(&quot;focusin&quot;, handleFocusIn);
    document.removeEventListener(&quot;focusout&quot;, handleLeave);
    document.removeEventListener(&quot;keydown&quot;, handleKeyDown);
    document.removeEventListener(&quot;contextmenu&quot;, handleContextMenu);
    tooltip = null;
  };

  document.addEventListener(&quot;pointerover&quot;, handlePointerOpen);
  document.addEventListener(&quot;pointerout&quot;, handleLeave);
  document.addEventListener(&quot;focusin&quot;, handleFocusIn);
  document.addEventListener(&quot;focusout&quot;, handleLeave);
  document.addEventListener(&quot;keydown&quot;, handleKeyDown);
  document.addEventListener(&quot;contextmenu&quot;, handleContextMenu);
  window.addEventListener(&quot;pagehide&quot;, destroy, { once: true });
})();
&lt;/script&gt;
