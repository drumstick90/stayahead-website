<div id="stayahead-trend-atlas">
  <style>
    #stayahead-trend-atlas {
      position: relative;
      width: 100%;
      color: var(--foreground);
      font-size: var(--font-size-base);
    }
    #stayahead-trend-atlas * { box-sizing: border-box; }
    #stayahead-trend-atlas .sah-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 12px;
    }
    #stayahead-trend-atlas h2,
    #stayahead-trend-atlas h3 { margin: 0; font-weight: 500; }
    #stayahead-trend-atlas h3 { margin-bottom: 6px; }
    #stayahead-trend-atlas .sah-subtitle,
    #stayahead-trend-atlas .sah-selection { color: var(--muted-foreground); }
    #stayahead-trend-atlas .sah-controls { min-width: min(100%, 360px); }
    #stayahead-trend-atlas .sah-controls label { display: block; margin-bottom: 4px; }
    #stayahead-trend-atlas .sah-legend {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin: 8px 0 14px;
    }
    #stayahead-trend-atlas .sah-legend button {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      padding: 2px 0;
      border: 0;
      background: transparent;
      color: var(--foreground);
      cursor: pointer;
    }
    #stayahead-trend-atlas .sah-legend button[aria-pressed="false"] { opacity: 0.35; }
    #stayahead-trend-atlas .sah-swatch { width: 10px; height: 10px; display: inline-block; }
    #stayahead-trend-atlas .sah-r1 { background: var(--viz-series-1); }
    #stayahead-trend-atlas .sah-r2 { background: var(--viz-series-2); }
    #stayahead-trend-atlas .sah-r3 { background: var(--viz-series-3); }
    #stayahead-trend-atlas .sah-r4 { background: var(--viz-series-4); }
    #stayahead-trend-atlas .sah-r5 { background: var(--viz-series-5); }
    #stayahead-trend-atlas .sah-block { margin-top: 18px; }
    #stayahead-trend-atlas .sah-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 22px;
      align-items: start;
    }
    #stayahead-trend-atlas .sah-chart { width: 100%; min-width: 0; }
    #stayahead-trend-atlas svg { display: block; width: 100%; overflow: visible; }
    #stayahead-trend-atlas svg text { fill: var(--foreground); font-size: 12px; }
    #stayahead-trend-atlas svg .sah-muted { fill: var(--muted-foreground); }
    #stayahead-trend-atlas svg .domain,
    #stayahead-trend-atlas svg .tick line { stroke: var(--border); }
    #stayahead-trend-atlas svg .sah-gridline line { stroke: var(--border); opacity: 0.55; }
    #stayahead-trend-atlas svg .sah-gridline .domain { display: none; }
    #stayahead-trend-atlas svg .axis-title { fill: var(--foreground); font-size: 12px; }
    #stayahead-trend-atlas .sah-tooltip {
      position: absolute;
      z-index: 4;
      max-width: 300px;
      padding: 8px 10px;
      border: 1px solid var(--border);
      background: var(--popover);
      color: var(--popover-foreground);
      white-space: pre-line;
      pointer-events: none;
    }
    @media (max-width: 700px) {
      #stayahead-trend-atlas .sah-grid { grid-template-columns: 1fr; }
      #stayahead-trend-atlas .sah-controls { width: 100%; }
    }
  </style>

  <div class="sah-head">
    <div>
      <h2>How papers stay in view</h2>
      <div class="sah-subtitle">Illustrative data · 263 days · 1,315 ranked appearances</div>
    </div>
    <div class="sah-controls">
      <label class="form-label" for="sah-paper-select">Inspect paper</label>
      <select id="sah-paper-select" class="form-select"></select>
    </div>
  </div>

  <div id="sah-selection" class="sah-selection"></div>
  <div class="sah-legend" aria-label="Rank filters">
    <span class="text-muted">Rank</span>
    <button type="button" data-rank="1" aria-pressed="true"><span class="sah-swatch sah-r1"></span>1</button>
    <button type="button" data-rank="2" aria-pressed="true"><span class="sah-swatch sah-r2"></span>2</button>
    <button type="button" data-rank="3" aria-pressed="true"><span class="sah-swatch sah-r3"></span>3</button>
    <button type="button" data-rank="4" aria-pressed="true"><span class="sah-swatch sah-r4"></span>4</button>
    <button type="button" data-rank="5" aria-pressed="true"><span class="sah-swatch sah-r5"></span>5</button>
  </div>

  <section class="sah-block">
    <h3>Persistence map</h3>
    <div id="sah-timeline" class="sah-chart"></div>
  </section>

  <div class="sah-grid sah-block">
    <section>
      <h3>Persistence constellation</h3>
      <div id="sah-scatter" class="sah-chart"></div>
    </section>
    <section>
      <h3>Selected paper score path</h3>
      <div id="sah-line" class="sah-chart"></div>
    </section>
  </div>

  <div id="sah-tooltip" class="sah-tooltip" role="tooltip" hidden></div>

  <script src="https://cdn.jsdelivr.net/npm/d3@7.9.0/dist/d3.min.js"></script>
  <script>
    (() => {
      const root = document.getElementById('stayahead-trend-atlas');
      const payload = (() => {
        const rows = [];
        const titles = {};
        const start = Date.UTC(2025, 0, 1);
        for (let paper = 0; paper < 63; paper += 1) {
          const id = 'paper-' + String(paper + 1).padStart(2, '0');
          titles[id] = {
            title: 'Illustrative paper ' + String(paper + 1).padStart(2, '0'),
            journal: 'Synthetic demo'
          };
        }
        for (let day = 0; day < 263; day += 1) {
          const dayText = new Date(start + day * 86400000).toISOString().slice(0, 10);
          for (let rank = 1; rank <= 5; rank += 1) {
            const paper = (Math.floor(day / 10) + (rank - 1) * 13) % 63;
            const id = 'paper-' + String(paper + 1).padStart(2, '0');
            const score = 420 + (5 - rank) * 160 + ((paper * 37 + day * 11) % 240);
            rows.push([dayText, id, rank, score]);
          }
        }
        return { rows, titles };
      })();
      const parseDay = d3.timeParse('%Y-%m-%d');
      const formatDay = d3.timeFormat('%d %b %Y');
      const formatScore = d3.format(',');
      const rankColor = rank => `var(--viz-series-${rank})`;
      const rows = payload.rows.map(d => ({ day: parseDay(d[0]), dayText: d[0], doi: d[1], rank: d[2], score: d[3] }));
      const visibleRanks = new Set([1, 2, 3, 4, 5]);
      const titleFor = doi => payload.titles[doi]?.title || doi;
      const journalFor = doi => payload.titles[doi]?.journal || 'Journal not enriched';
      const byPaper = d3.group(rows, d => d.doi);
      const papers = Array.from(byPaper, ([doi, values]) => {
        values.sort((a, b) => d3.ascending(a.day, b.day));
        return {
          doi,
          values,
          title: titleFor(doi),
          journal: journalFor(doi),
          appearances: values.length,
          first: d3.min(values, d => d.day),
          last: d3.max(values, d => d.day),
          peak: d3.max(values, d => d.score),
          meanRank: d3.mean(values, d => d.rank),
          rankOneDays: d3.sum(values, d => d.rank === 1 ? 1 : 0)
        };
      }).sort((a, b) => d3.descending(a.appearances, b.appearances) || d3.descending(a.peak, b.peak));
      const paperByDoi = new Map(papers.map(d => [d.doi, d]));
      let selectedDoi = papers[0].doi;
      const select = root.querySelector('#sah-paper-select');
      const selection = root.querySelector('#sah-selection');
      const tooltip = root.querySelector('#sah-tooltip');

      papers.forEach(p => {
        const option = document.createElement('option');
        option.value = p.doi;
        option.textContent = p.title === p.doi ? p.doi : `${p.title} (${p.doi})`;
        select.appendChild(option);
      });
      select.value = selectedDoi;

      function showTooltip(event, lines) {
        tooltip.textContent = lines.join('\n');
        tooltip.hidden = false;
        const rootBox = root.getBoundingClientRect();
        const tipBox = tooltip.getBoundingClientRect();
        let left = event.clientX - rootBox.left + 12;
        let top = event.clientY - rootBox.top + 12;
        left = Math.min(left, rootBox.width - tipBox.width - 6);
        top = Math.max(6, Math.min(top, rootBox.height - tipBox.height - 6));
        tooltip.style.left = `${Math.max(6, left)}px`;
        tooltip.style.top = `${top}px`;
      }
      function hideTooltip() { tooltip.hidden = true; }

      function updateSelection(doi) {
        selectedDoi = doi;
        select.value = doi;
        const p = paperByDoi.get(doi);
        selection.textContent = `${p.title} · ${p.appearances} appearances · ${p.rankOneDays} days at rank 1 · score ${formatScore(d3.min(p.values, d => d.score))}–${formatScore(p.peak)}`;
        drawAll();
      }

      function addFrame(svg, x, y, width, height) {
        svg.append('rect')
          .attr('data-chart-frame', '')
          .attr('x', x).attr('y', y).attr('width', width).attr('height', height)
          .attr('fill', 'none').attr('stroke', 'var(--border)');
      }

      function drawTimeline() {
        const container = root.querySelector('#sah-timeline');
        container.replaceChildren();
        const width = Math.max(320, container.getBoundingClientRect().width);
        const height = width < 500 ? 430 : 470;
        const margin = { top: 10, right: 16, bottom: 46, left: 66 };
        const innerW = width - margin.left - margin.right;
        const innerH = height - margin.top - margin.bottom;
        const ordered = [...papers].sort((a, b) => d3.ascending(a.first, b.first) || d3.descending(a.appearances, b.appearances));
        const x = d3.scaleTime().domain(d3.extent(rows, d => d.day)).range([margin.left + 3, margin.left + innerW - 3]);
        const y = d3.scaleBand().domain(ordered.map(d => d.doi)).range([margin.top + 3, margin.top + innerH - 3]).padding(0.16);
        const svg = d3.select(container).append('svg').attr('viewBox', `0 0 ${width} ${height}`).attr('role', 'img').attr('aria-label', 'Timeline of every ranked paper appearance across 263 days');
        svg.append('title').text('Persistence map of paper appearances');
        svg.append('desc').text('Each horizontal lane is a DOI. Marks show daily appearances and color shows rank from one to five.');
        addFrame(svg, margin.left, margin.top, innerW, innerH);
        const xAxis = d3.axisBottom(x).ticks(width < 500 ? 4 : 7).tickSizeOuter(0);
        svg.append('g').attr('transform', `translate(0,${margin.top + innerH})`).call(xAxis);
        svg.append('text').attr('class', 'axis-title').attr('data-axis', 'x').attr('x', margin.left + innerW / 2).attr('y', height - 5).attr('text-anchor', 'middle').text('Date');
        svg.append('text').attr('class', 'axis-title').attr('data-axis', 'y').attr('transform', `translate(15,${margin.top + innerH / 2}) rotate(-90)`).attr('text-anchor', 'middle').text('Papers ordered by first appearance');
        const marks = rows.filter(d => visibleRanks.has(d.rank));
        svg.append('g').selectAll('rect').data(marks).join('rect')
          .attr('x', d => x(d.day) - 1.4)
          .attr('y', d => y(d.doi) + Math.max(0, y.bandwidth() * 0.1))
          .attr('width', 2.8)
          .attr('height', Math.max(2, y.bandwidth() * 0.8))
          .attr('fill', d => rankColor(d.rank))
          .attr('opacity', d => d.doi === selectedDoi ? 1 : 0.66)
          .on('pointerenter pointermove', (event, d) => showTooltip(event, [titleFor(d.doi), d.doi, `${formatDay(d.day)} · rank ${d.rank} · score ${formatScore(d.score)}`]))
          .on('pointerleave', hideTooltip)
          .on('click', (_, d) => updateSelection(d.doi));
        const selected = paperByDoi.get(selectedDoi);
        svg.append('rect')
          .attr('x', margin.left + 1).attr('y', y(selectedDoi) - 1)
          .attr('width', innerW - 2).attr('height', y.bandwidth() + 2)
          .attr('fill', 'none').attr('stroke', 'var(--foreground)').attr('stroke-width', 1.5)
          .attr('pointer-events', 'none');
        svg.append('text').attr('class', 'sah-muted').attr('x', margin.left + 5).attr('y', y(selectedDoi) - 4).text(selected.title.length > 50 ? `${selected.title.slice(0, 47)}…` : selected.title);
      }

      function drawScatter() {
        const container = root.querySelector('#sah-scatter');
        container.replaceChildren();
        const width = Math.max(320, container.getBoundingClientRect().width);
        const height = width < 500 ? 390 : 420;
        const margin = { top: 14, right: 18, bottom: 54, left: 68 };
        const innerW = width - margin.left - margin.right;
        const innerH = height - margin.top - margin.bottom;
        const xExtent = d3.extent(papers, d => d.appearances);
        const yExtent = d3.extent(papers, d => d.peak);
        const x = d3.scaleLinear().domain([Math.max(0, xExtent[0] - 2), xExtent[1] + 3]).nice().range([margin.left + 4, margin.left + innerW - 4]);
        const y = d3.scaleLinear().domain([Math.max(0, yExtent[0] - 100), yExtent[1] + 180]).nice().range([margin.top + innerH - 4, margin.top + 4]);
        const r = d3.scaleSqrt().domain(d3.extent(papers, d => d.rankOneDays)).range([4, 12]);
        const svg = d3.select(container).append('svg').attr('viewBox', `0 0 ${width} ${height}`).attr('role', 'img').attr('aria-label', 'Scatter plot comparing paper persistence and peak score');
        svg.append('title').text('Persistence constellation');
        svg.append('desc').text('Papers are positioned by number of appearances and peak score. Circle size represents days at rank one.');
        addFrame(svg, margin.left, margin.top, innerW, innerH);
        svg.append('g').attr('class', 'sah-gridline').attr('transform', `translate(0,${margin.top + innerH})`).call(d3.axisBottom(x).ticks(width < 500 ? 4 : 6).tickSize(-innerH).tickFormat(''));
        svg.append('g').attr('class', 'sah-gridline').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-innerW).tickFormat(''));
        svg.append('g').attr('transform', `translate(0,${margin.top + innerH})`).call(d3.axisBottom(x).ticks(width < 500 ? 4 : 6).tickSizeOuter(0));
        svg.append('g').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5).tickFormat(d3.format('~s')).tickSizeOuter(0));
        svg.append('text').attr('class', 'axis-title').attr('data-axis', 'x').attr('x', margin.left + innerW / 2).attr('y', height - 7).attr('text-anchor', 'middle').text('Appearances (days)');
        svg.append('text').attr('class', 'axis-title').attr('data-axis', 'y').attr('transform', `translate(15,${margin.top + innerH / 2}) rotate(-90)`).attr('text-anchor', 'middle').text('Peak score');
        const points = svg.append('g').selectAll('circle').data(papers.filter(p => p.values.some(v => visibleRanks.has(v.rank)))).join('circle')
          .attr('cx', d => x(d.appearances)).attr('cy', d => y(d.peak)).attr('r', d => r(d.rankOneDays))
          .attr('fill', d => rankColor(Math.max(1, Math.min(5, Math.round(d.meanRank)))))
          .attr('opacity', d => d.doi === selectedDoi ? 1 : 0.58)
          .attr('stroke', d => d.doi === selectedDoi ? 'var(--foreground)' : 'none')
          .attr('stroke-width', 2)
          .style('cursor', 'pointer')
          .on('pointerenter pointermove', (event, d) => showTooltip(event, [d.title, d.doi, `${d.appearances} appearances · peak ${formatScore(d.peak)} · mean rank ${d.meanRank.toFixed(1)}`, `${d.rankOneDays} days at rank 1`]))
          .on('pointerleave', hideTooltip)
          .on('click', (_, d) => updateSelection(d.doi));
        points.filter(d => d.doi === selectedDoi).raise();
      }

      function drawLine() {
        const container = root.querySelector('#sah-line');
        container.replaceChildren();
        const width = Math.max(320, container.getBoundingClientRect().width);
        const height = width < 500 ? 390 : 420;
        const margin = { top: 14, right: 18, bottom: 54, left: 68 };
        const innerW = width - margin.left - margin.right;
        const innerH = height - margin.top - margin.bottom;
        const paper = paperByDoi.get(selectedDoi);
        const values = paper.values.filter(d => visibleRanks.has(d.rank));
        const allValues = paper.values;
        const xExtent = d3.extent(allValues, d => d.day);
        const xPad = Math.max(86400000, (xExtent[1] - xExtent[0]) * 0.03);
        const yExtent = d3.extent(allValues, d => d.score);
        const yPad = Math.max(10, (yExtent[1] - yExtent[0]) * 0.1);
        const x = d3.scaleTime().domain([new Date(+xExtent[0] - xPad), new Date(+xExtent[1] + xPad)]).range([margin.left + 4, margin.left + innerW - 4]);
        const y = d3.scaleLinear().domain([Math.max(0, yExtent[0] - yPad), yExtent[1] + yPad]).nice().range([margin.top + innerH - 4, margin.top + 4]);
        const svg = d3.select(container).append('svg').attr('viewBox', `0 0 ${width} ${height}`).attr('role', 'img').attr('aria-label', `Score trajectory for ${paper.title}`);
        svg.append('title').text(`Score trajectory for ${paper.title}`);
        svg.append('desc').text('The line follows score over time. Point color identifies daily rank from one to five.');
        addFrame(svg, margin.left, margin.top, innerW, innerH);
        svg.append('g').attr('class', 'sah-gridline').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5).tickSize(-innerW).tickFormat(''));
        svg.append('g').attr('transform', `translate(0,${margin.top + innerH})`).call(d3.axisBottom(x).ticks(width < 500 ? 4 : 6).tickSizeOuter(0));
        svg.append('g').attr('transform', `translate(${margin.left},0)`).call(d3.axisLeft(y).ticks(5).tickFormat(d3.format('~s')).tickSizeOuter(0));
        svg.append('text').attr('class', 'axis-title').attr('data-axis', 'x').attr('x', margin.left + innerW / 2).attr('y', height - 7).attr('text-anchor', 'middle').text('Appearance date');
        svg.append('text').attr('class', 'axis-title').attr('data-axis', 'y').attr('transform', `translate(15,${margin.top + innerH / 2}) rotate(-90)`).attr('text-anchor', 'middle').text('Illustrative score');
        if (values.length > 1) {
          svg.append('path').datum(values).attr('fill', 'none').attr('stroke', 'var(--foreground)').attr('stroke-width', 1.5).attr('d', d3.line().x(d => x(d.day)).y(d => y(d.score)));
        }
        svg.append('g').selectAll('circle').data(values).join('circle')
          .attr('cx', d => x(d.day)).attr('cy', d => y(d.score)).attr('r', 4)
          .attr('fill', d => rankColor(d.rank)).attr('stroke', 'var(--background)').attr('stroke-width', 1)
          .on('pointerenter pointermove', (event, d) => showTooltip(event, [paper.title, `${formatDay(d.day)} · rank ${d.rank} · score ${formatScore(d.score)}`]))
          .on('pointerleave', hideTooltip);
      }

      function drawAll() {
        drawTimeline();
        drawScatter();
        drawLine();
      }

      select.addEventListener('change', event => updateSelection(event.target.value));
      root.querySelectorAll('.sah-legend button').forEach(button => {
        button.addEventListener('click', () => {
          const rank = Number(button.dataset.rank);
          if (visibleRanks.has(rank) && visibleRanks.size > 1) visibleRanks.delete(rank);
          else visibleRanks.add(rank);
          button.setAttribute('aria-pressed', String(visibleRanks.has(rank)));
          drawAll();
        });
      });
      const observer = new ResizeObserver(() => drawAll());
      observer.observe(root);
      updateSelection(selectedDoi);
    })();
  </script>
</div>
